# =============================================================================
# codx-junior DIND — LOCALHOST overlay
#
# The outer container publishes the inner web UI on the loopback interface.
# Use --coworking inside the DIND (the inner API talks to its own nested daemon,
# never to the host socket).
# =============================================================================
services:
  dind:
    ports:
      - "${CODX_BIND_ADDRESS:-127.0.0.1}:${CODX_JUNIOR_WEB_PORT:-19981}:19981"
