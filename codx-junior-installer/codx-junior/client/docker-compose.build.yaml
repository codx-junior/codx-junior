# =============================================================================
# codx-junior — BUILD overlay for the split (legacy) client image
#
# The multi-container deployment serves the SPA from its own image. This file
# only declares the build; the running stack is the compose project in the
# parent directory.
#
#   cd codx-junior-installer/codx-junior/client
#   docker compose -f docker-compose.build.yaml build
#
# The build context is the repository root (`../../..` from here).
# =============================================================================
services:
  codx-junior-client:
    image: codxjunior/codx-junior:client
    build:
      context: ../../..
      dockerfile: codx-junior-installer/codx-junior/client/Dockerfile.client
