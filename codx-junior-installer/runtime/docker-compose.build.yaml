# =============================================================================
# codx-junior — BUILD overlay (only with --build)
#
# Builds the application image from the checkout. The context is resolved from
# this file: runtime/ -> ../.. = repository root.
# =============================================================================
services:
  codx-junior:
    build:
      context: ${CODX_BUILD_CONTEXT:-../..}
      dockerfile: codx-junior-installer/demo/Dockerfile
      args:
        CODX_JUNIOR_BUILD_VERSION: ${CODX_JUNIOR_BUILD_VERSION:-unknown}
        CODX_JUNIOR_BUILD_REF: ${CODX_JUNIOR_BUILD_REF:-unknown}
        CODX_JUNIOR_BUILD_COMMIT: ${CODX_JUNIOR_BUILD_COMMIT:-unknown}
