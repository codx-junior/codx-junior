# =============================================================================
# codx-junior demo — web server
#
# Replaces the `codx-junior-client` container (Node + `vite preview`) of the
# full deployment:
#   * serves the compiled SPA from disk (no Node process, a few MB of RSS)
#   * proxies /api to the API process on 127.0.0.1:19980, so the browser keeps
#     talking to a single origin and Traefik is not needed
#   * proxies the socket.io websocket (/api/socket.io)
# =============================================================================

worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/codx-junior-supervisor/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/codx-junior-supervisor/nginx-access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 512m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/wasm image/svg+xml;
    gzip_min_length 1024;

    # The API can hold a request open while an agent turn runs.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 19981;
        server_name _;

        root /usr/share/codx-junior/client;
        index index.html;

        # --- API + socket.io -------------------------------------------------
        location /api/ {
            proxy_pass http://127.0.0.1:19980;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # --- built assets (hashed by vite) -----------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # --- SPA fallback ----------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }
    }
}
