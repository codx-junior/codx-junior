# =============================================================================
# codx-junior DIND — INNER localhost publish
#
# Used only inside the DIND image. The nested app publishes 19981 on the outer
# container's network namespace; docker-compose.local.yaml on the host maps it
# to 127.0.0.1:<port>.
# =============================================================================
services:
  codx-junior:
    ports:
      - "19981:19981"
