# =============================================================================
# codx-junior — LOCALHOST overlay
#
# Publishes the web UI on the loopback interface only. This is the "try it on
# my laptop / CI box" mode: no domain, no TLS, no Traefik, no Docker socket by
# default. Use --coworking to add the socket overlay when you want the browser /
# computer features.
# =============================================================================
services:
  codx-junior:
    ports:
      - "${CODX_BIND_ADDRESS:-127.0.0.1}:${CODX_JUNIOR_WEB_PORT:-19981}:19981"
