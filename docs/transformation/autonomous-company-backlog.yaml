# Autonomous company — actionable backlog
# Companion to docs/transformation/autonomous-company-roadmap.md
#
# Conventions
#   id          stable task id (AC-<phase><number>)
#   area        api | client | both | platform | docs
#   size        S <= 1 day | M 2-3 days | L 4-5 days | XL > 5 days (split first)
#   priority    P0 blocks phase exit | P1 required for phase | P2 can slip one phase
#   deps        task ids that must be done first
#   acceptance  testable definition of done
#
# Definition of done (all tasks): code + tests + typed company event + audit entry
# + API docs + client contract + i18n keys (no hardcoded English) + no phase-gate regression.

