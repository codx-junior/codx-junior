# =============================================================================
# codx-junior DIND — INNER slave publish
#
# Used only inside the DIND image. The nested slave Traefik binds :80 on the
# outer container's network namespace; the host master reaches it through the
# external proxy network (dind/docker-compose.slave.yaml). No :443 here: TLS is
# terminated by the master.
# =============================================================================
services:
  traefik:
    ports:
      - "80:80"
