# =============================================================================
# codx-junior — DEV overlay (used by ./dev-install.sh, never by an install)
#
# The release image is a built artifact: no source, no control plane. A
# developer wants the opposite — the checkout being edited, live, with the real
# `.codx` (tasks, boards, profiles, chat turns) and without rebuilding the image
# every time a Python file changes.
#
# So this overlay:
#   * builds codxjuniorai/codx-junior:dev from the checkout;
#   * mounts the repository at the app path, so api/, scripts/, set_env.sh and
#     .codx are the working tree (no rebuild for a code change);
#   * turns on DEBUG logging. Source reload is opt-in through
#     CODX_JUNIOR_API_RELOAD=1 (`./dev-install.sh --reload`), because a reload
#     interrupts in-flight agent turns.
# =============================================================================
services:
  codx-junior:
    build:
      context: ../..
      dockerfile: codx-junior-installer/demo/Dockerfile
      args:
        CODX_JUNIOR_BUILD_VERSION: ${CODX_JUNIOR_BUILD_VERSION:-unknown}
        CODX_JUNIOR_BUILD_REF: ${CODX_JUNIOR_BUILD_VERSION:-unknown}
        CODX_JUNIOR_BUILD_COMMIT: ${CODX_JUNIOR_BUILD_COMMIT:-unknown}
    environment:
      DEBUG: "1"
      CODX_JUNIOR_SKIP_INSTALL: "1"
    volumes:
      # The whole checkout, not just .codx: the API imports its code from this
      # path (scripts/run_api.sh puts api/ on PYTHONPATH), so an edit is live as
      # soon as the process restarts — or immediately with --reload.
      - ../../:/home/codx-junior/codx-junior
