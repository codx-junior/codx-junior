# =============================================================================
# codx-junior — application runtime (one container)
#
# This is the only compose file that starts the product. Every deployment mode
# adds one small overlay on top of it:
#
#   local   + docker-compose.local.yaml      publish 127.0.0.1:19981
#   server  + docker-compose.master.yaml     Traefik master: :80/:443 + ACME
#   slave   + docker-compose.slave.yaml      Traefik slave: :80, trusts a master
#   any     + docker-compose.coworking.yaml  /var/run/docker.sock (optional)
#
# The API and the background worker already live in this single container
# (supervisord, see codx-junior-installer/demo/supervisord.conf); knowledge is
# embedded LanceDB; there is no external vector database, model server or
# client container. Do not add them back here: model servers are external
# OpenAI-compatible endpoints that an admin can run in a coworking desktop.
#
# The installer always runs this with an explicit project directory and
# --env-file; see codx-junior-installer/install.sh.
# =============================================================================
name: ${CODX_INSTANCE:-codx-junior}

services:
  codx-junior:
    image: ${CODX_JUNIOR_IMAGE:-codxjuniorai/codx-junior:latest}
    container_name: ${CODX_INSTANCE:-codx-junior}
    restart: unless-stopped
    env_file:
      - ${CODX_ENV_FILE:?CODX_ENV_FILE must point to the settings file}
    environment:
      # socket.io keeps its sessions in-process: do not scale this to >1.
      WEB_CONCURRENCY: "1"
      ANONYMIZED_TELEMETRY: "False"
      # Container paths are fixed; the HOST projects folder is only used by the
      # bind mount below. Passing the host path through env_file would make the
      # API look for a path that does not exist inside the container.
      CODX_JUNIOR_PROJECTS_PATH: /home/codx-junior-projects
      CODX_JUNIOR_CONFIG_FOLDER: /home/codx-junior/.codx-junior
      CODX_JUNIOR_KNOWLEDGE_BACKEND: ${CODX_JUNIOR_KNOWLEDGE_BACKEND:-lancedb}
      # Used by the Traefik rules generated by the API and by the workspace
      # compatibility routes. `localhost` keeps the UI working without a proxy.
      CODX_JUNIOR_DOMAIN: ${CODX_JUNIOR_DOMAIN:-localhost}
      # Must match the middleware label below. The name is instance-scoped so
      # several instances can share one master Traefik without colliding.
      CODX_JUNIOR_TRAEFIK_AUTH_MIDDLEWARE: ${CODX_INSTANCE:-codx-junior}-auth@docker
      # Entry points the local Traefik defines. A slave has only `web`; a
      # standalone master has `web,websecure` (the default).
      CODX_JUNIOR_TRAEFIK_ENTRYPOINTS: ${CODX_TRAEFIK_ENTRYPOINTS:-web,websecure}
      # Name used by the DevOps `traefik` tool (old default:
      # traefik-codx-junior). CLI flags replace the old static file.
      CODX_JUNIOR_TRAEFIK_CONTAINER: ${CODX_INSTANCE:-codx-junior}-traefik
    volumes:
      # The only host path that carries user data.
      - ${CODX_JUNIOR_PROJECTS_PATH:?set CODX_JUNIOR_PROJECTS_PATH}:/home/codx-junior-projects
      # Settings (global settings, users, profiles) and analytics/logs.
      - ${CODX_DATA_DIR:?set CODX_DATA_DIR}/settings:/home/codx-junior/.codx-junior
      - ${CODX_DATA_DIR:?set CODX_DATA_DIR}/analytics:/home/codx-junior/analytics
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19980/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Migrations and the first index build can take a while on a small VM.
      start_period: 60s
    labels:
      # Even in local mode the labels are inert (no Traefik container); keeping
      # them here means a proxy overlay only has to add its routers.
      - traefik.enable=true
      - traefik.http.services.${CODX_INSTANCE:-codx-junior}.loadbalancer.server.port=19981
      # forwardAuth endpoint used by the HTTP-provider routes (custom rules and
      # external workspace apps). It lives in the Docker provider.
      - traefik.http.middlewares.${CODX_INSTANCE:-codx-junior}-auth.forwardAuth.address=http://codx-junior:19980/api/forward-auth
      - traefik.http.middlewares.${CODX_INSTANCE:-codx-junior}-auth.forwardAuth.trustForwardHeader=true
    networks:
      - internal

networks:
  internal:
    name: ${CODX_INSTANCE:-codx-junior}-internal
