# =============================================================================
# codx-junior DIND — TRAEFIK MASTER overlay
#
# The nested stack runs its own Traefik master (ACME + :80/:443); the outer
# container only publishes those two ports to the host. One instance per host:
# a second master cannot bind the same ports. Use slave mode for that.
# =============================================================================
services:
  dind:
    ports:
      - "80:80"
      - "443:443"
