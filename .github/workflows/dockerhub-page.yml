# =============================================================================
# codx-junior — Docker Hub repository page
#
# WHY THIS EXISTS
# The Docker Hub page is the first thing a user reads before pulling the image.
# It is documentation, not a build artifact, so it has its own workflow: any
# push to main (or a release tag) refreshes the page from DOCKERHUB.md without
# rebuilding the image.
#
# The sync uses peter-evans/dockerhub-description, which performs the same
# Docker Hub API PATCH as scripts/dockerhub_description.sh. Docker Hub only
# accepts that PATCH from a personal access token with read/write/delete scope,
# owned by a user with Admin on the repository. A read/write token that can
# push images is NOT sufficient, and an organization access token is rejected.
#
# The image itself is published by release.yml.
#
# Secrets required: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (read/write/delete PAT).
# =============================================================================

name: dockerhub-page

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

# One writer at a time: the Hub API replaces the whole README, so overlapping
# runs must not interleave an older page with a newer one.
concurrency:
  group: dockerhub-page
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: sync DOCKERHUB.md
    # Only the integration branch and release tags may publish the public page;
    # a manual dispatch from a feature branch is a no-op (use --dry-run locally
    # to preview its DOCKERHUB.md).
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish DOCKERHUB.md to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: codxjuniorai/codx-junior
          short-description: Open-source multi-AI workspace to plan, code, test and ship software. Self-host with Docker.
          readme-filepath: ./DOCKERHUB.md
