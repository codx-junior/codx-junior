; =============================================================================
; codx-junior — development supervisord
;
; API and background worker come from the mounted checkout (uvicorn --reload),
; and the web process is the Vite dev server, not nginx. Vite serves the SPA
; from source, proxies /api + socket.io to the API and provides HMR.
;
; The mounted checkout is at /home/codx-junior/codx-junior. Node dependencies
; are baked at /home/codx-junior/node_modules (an ancestor of the client
; project), so the bind mount never hides them.
; =============================================================================

[unix_http_server]
file=/tmp/codx-junior-supervisor.sock

[supervisord]
logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/supervisord.log
logfile_maxbytes=20MB
logfile_backups=2
loglevel=info
pidfile=/tmp/codx-junior-supervisord.pid
nodaemon=true
minfds=1024
minprocs=200
childlogdir=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/codx-junior-supervisor.sock

[program:api]
command=bash %(ENV_CODX_JUNIOR_PATH)s/scripts/run_api.sh
directory=%(ENV_CODX_JUNIOR_PATH)s
environment=CODX_JUNIOR_API_BACKGROUND="",CODX_JUNIOR_SKIP_INSTALL="1",CODX_JUNIOR_API_RELOAD="1"
autostart=true
autorestart=true
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2

[program:api-background]
command=bash %(ENV_CODX_JUNIOR_PATH)s/scripts/run_api.sh
directory=%(ENV_CODX_JUNIOR_PATH)s
environment=CODX_JUNIOR_API_BACKGROUND="1",CODX_JUNIOR_SKIP_INSTALL="1",CODX_JUNIOR_API_RELOAD="1"
autostart=true
autorestart=true
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/api-background.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2

[program:web]
; npm is not needed at runtime: run Vite from the baked node_modules. Vite
; resolves plugins from /home/codx-junior/node_modules (parent of client/).
command=bash -lc "cd %(ENV_CODX_JUNIOR_PATH)s/client && PATH=/home/codx-junior/node_modules/.bin:$PATH exec vite --host 0.0.0.0 --port 19981"
directory=%(ENV_CODX_JUNIOR_PATH)s/client
environment=DEBUG="1",CODX_JUNIOR_WEB_PORT="19981"
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
