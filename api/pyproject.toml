[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "codx-junior"
version = "0.1.0"
description = "Your AI coding assistant"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
  'openai>=2.24.0',
  'langchain>=1.1.0',
  'langchain-community>=0.4.1',
  'langchain-text-splitters>=1.0.0',
  'flask>=2.0.2',
  'python-slugify>=8.0.1',
  'llama-index>=0.9.42',
  'uvicorn>=0.38.0',
  'python-socketio>=5.9.0',
  # The API runs with several uvicorn workers. A socket.io *client* (the
  # background worker connecting to the API) must use the websocket transport:
  # a long-polling session breaks as soon as its next request is served by
  # another worker, and the reconnect loop floods every client.
  'websocket-client>=1.8.0',
  'fastapi>=0.122.0',
  'python-multipart>=0.0.20',
  'pytesseract',
  'pillow',
  'beautifulsoup4',
  'markdownify',
  # Embedded vector database: the built-in knowledge/RAG backend. It is an
  # in-process library (no server, no container), which is what allows a trial
  # installation to have working knowledge search out of the box.
  'lancedb>=0.5.0',
  'watchfiles>=1.0.4',
  'pyjwt>=2.10.1',
  'bcrypt>=4.3.0',
  'ffmpeg>=1.4',
  'aiofiles>=24.1.0',
  'html2text',
  'watchdog',
  'pypandoc>=1.16',
  'jinja2>=3.0.3',
  'pathspec>=1.1.1',
  'ddgs>=9.16.0',
  'PyMuPDF>=1.23.0',
  'vegaml>=0.9.0',
  'trafilatura>=2.0.0',
  'readability-lxml>=0.8.1',
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Heavy, OPTIONAL dependencies. They are not installed by the slim/demo image
# (see codx-junior-installer/demo/Dockerfile): the API imports them lazily and
# degrades with a clear message when they are missing, so a trial installation
# does not have to download torch (~2.5 GB), the CUDA-less vLLM stack or a
# browser runtime before the first chat.
#
# Full installations keep today's behaviour by installing
# `.[local-models,browser,milvus]` (scripts/install_api.sh does exactly that).
[project.optional-dependencies]
test = [
    "pytest>=7.3.1",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.21.1",
]
doc = [
]
# Local embeddings (all-MiniLM-L6-v2 + the hybrid embeddings model)
local-models = [
    "sentence-transformers>=6.2.0",
    "torch>=2.4.0",
]
# Browser automation (Playwright: the browser sessions run inside containers,
# this is only the Python client used by the fetch/browser tools)
browser = [
    "playwright",
]
# Milvus vector database client. Only needed when
# CODX_JUNIOR_KNOWLEDGE_BACKEND=milvus: the default (lancedb) backend is embedded
# and part of the base dependencies, while pymilvus pulls grpcio and the
# milvus-lite binary.
milvus = [
    "pymilvus>=2.4.0",
]
# Deprecated local inference server (codx/junior/ai/vllm_cpu_ai.py)
vllm = [
    "vllm>=0.5.0",
]
# Everything a full deployment needs
full = [
    "sentence-transformers>=6.2.0",
    "torch>=2.4.0",
    "playwright",
    "pymilvus>=2.4.0",
]
[project.scripts]
codx-junior = 'codx.app:app'

[tool.setuptools]
packages = ["codx"]

[tool.ruff]
select = ["F", "E", "W", "I001"]
line-length = 100
target-version = "py311"

[project.urls]
"Homepage" = "https://github.com"
"Bug Tracker" = "https://github.com"

# --- UV-SPECIFIC CONFIGURATION ---

[tool.uv]
# Extras a plain `uv sync` installs (source / dev deployments). They keep the
# full feature set: local embeddings + the browser client. The slim demo image
# installs with pip and no extras, so it never downloads torch.
default-extras = ["local-models", "browser", "milvus"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }