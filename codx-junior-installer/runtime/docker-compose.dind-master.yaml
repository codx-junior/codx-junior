# =============================================================================
# codx-junior DIND — INNER master publish
#
# Used only inside the DIND image. The nested master Traefik binds :80/:443 on
# the outer container's network namespace; the host DIND master overlay maps
# them to the host.
# =============================================================================
services:
  traefik:
    ports:
      - "80:80"
      - "443:443"
