; =============================================================================
; codx-junior demo — supervisord
;
; Three processes, the same ones the full deployment runs, but all inside a
; single container:
;   api          -> uvicorn on 19980 (user facing)
;   background   -> orchestration worker / project watchers on 19984
;   web          -> nginx on 19981 (SPA + /api proxy)
;
; Starting/restarting a process must never install anything: the venv is baked
; into the image and CODX_JUNIOR_SKIP_INSTALL disables the chown/uv-sync the
; source deployment does on start.
; =============================================================================

[unix_http_server]
file=/tmp/codx-junior-supervisor.sock

[supervisord]
logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/supervisord.log
logfile_maxbytes=20MB
logfile_backups=3
loglevel=info
pidfile=/tmp/codx-junior-supervisord.pid
nodaemon=true
minfds=1024
minprocs=200
childlogdir=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/codx-junior-supervisor.sock

[program:api]
command=bash %(ENV_CODX_JUNIOR_PATH)s/scripts/run_api.sh
directory=%(ENV_CODX_JUNIOR_PATH)s
environment=CODX_JUNIOR_API_BACKGROUND="",CODX_JUNIOR_SKIP_INSTALL="1"
autostart=true
autorestart=true
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:api-background]
command=bash %(ENV_CODX_JUNIOR_PATH)s/scripts/run_api.sh
directory=%(ENV_CODX_JUNIOR_PATH)s
environment=CODX_JUNIOR_API_BACKGROUND="1",CODX_JUNIOR_SKIP_INSTALL="1"
autostart=true
autorestart=true
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/api-background.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:web]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
